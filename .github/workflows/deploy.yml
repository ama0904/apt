name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install beautifulsoup4 lxml

      - name: Regenerate product pages from _data/products.json
        run: python _tools/site_builder.py build

      - name: Assemble Pages artifact
        run: |
          cp _tools/admin.html www.apetto.com.tw/admin.html
          if [ -f _tools/admin_secret.json ]; then cp _tools/admin_secret.json www.apetto.com.tw/admin_secret.json; fi
          touch www.apetto.com.tw/.nojekyll
          rm -rf www.apetto.com.tw/_raw_html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www.apetto.com.tw

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
