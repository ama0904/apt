<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>apetto 商品後台</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --text:#1f2328; --muted:#6b7280; --accent:#2563eb; --danger:#dc2626; --ok:#16a34a; --warn:#b45309; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--text); }
  header { background:#111827; color:#fff; padding:12px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  header .sp { flex:1; }
  header a, header button.link { color:#cbd5e1; text-decoration:none; font-size:14px; background:none; border:none; padding:0; cursor:pointer; }
  header a:hover, header button.link:hover { color:#fff; }
  #deploy { background:#fffbeb; border-bottom:1px solid #fde68a; color:var(--warn); padding:8px 24px; font-size:14px; display:none; }
  #deploy.ok { background:#ecfdf5; border-color:#a7f3d0; color:#065f46; }
  #deploy.bad { background:#fef2f2; border-color:#fecaca; color:var(--danger); }
  #deploy a { color:inherit; }
  main { max-width:1200px; margin:24px auto; padding:0 16px; }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .toolbar .count { color:var(--muted); font-size:14px; }
  button { font:inherit; border:1px solid var(--line); background:#fff; color:var(--text); padding:7px 12px; border-radius:8px; cursor:pointer; }
  button:hover { background:#f1f3f5; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { background:#1d4ed8; }
  button.danger { color:var(--danger); border-color:#fecaca; }
  button.danger:hover { background:#fef2f2; }
  button.small { padding:4px 8px; font-size:13px; }
  button:disabled { opacity:.5; cursor:default; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; font-size:14px; }
  th { background:#f9fafb; color:var(--muted); font-weight:600; font-size:13px; }
  tr:last-child td { border-bottom:none; }
  tr.hidden-row td { opacity:.55; }
  td img { width:56px; height:56px; object-fit:cover; border-radius:8px; border:1px solid var(--line); background:#fff; }
  .tag { display:inline-block; padding:2px 8px; border-radius:999px; background:#eef2ff; color:#3730a3; font-size:12px; margin:1px 2px 1px 0; }
  .tag.sec { background:#ecfdf5; color:#065f46; }
  .badge { font-size:12px; padding:2px 8px; border-radius:999px; }
  .badge.on { background:#dcfce7; color:#166534; }
  .badge.off { background:#f3f4f6; color:#6b7280; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; }
  .name a { color:var(--text); text-decoration:none; font-weight:600; }
  .name a:hover { color:var(--accent); }
  .muted { color:var(--muted); font-size:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; max-width:560px; margin:40px auto; }
  .card h2 { margin:0 0 8px; font-size:18px; }
  .card p { font-size:14px; color:var(--muted); line-height:1.6; }
  dialog { border:none; border-radius:14px; padding:0; width:min(780px, 94vw); max-height:92vh; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .dlg-head { display:flex; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); }
  .dlg-head h2 { margin:0; font-size:17px; flex:1; }
  .dlg-body { padding:16px 20px; overflow:auto; max-height:calc(92vh - 130px); }
  .dlg-foot { padding:12px 20px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end; align-items:center; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }
  .grid .full { grid-column:1 / -1; }
  label.f { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  input[type=text], input[type=number], input[type=password], textarea, select { width:100%; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  textarea { min-height:80px; resize:vertical; }
  textarea.tall { min-height:160px; font-family:ui-monospace,Consolas,monospace; font-size:13px; }
  .checks { display:flex; gap:12px; flex-wrap:wrap; padding:6px 0; }
  .checks label { font-size:14px; display:flex; gap:6px; align-items:center; }
  .thumbs { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .thumbs img { width:64px; height:64px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  .err { color:var(--danger); font-size:14px; margin-right:auto; }
  .progress { font-size:13px; color:var(--muted); margin-right:auto; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:50; }
  #toast.show { opacity:1; }
  code { background:#f3f4f6; padding:1px 5px; border-radius:4px; font-size:12px; }
  @media (max-width:720px) { .grid { grid-template-columns:1fr; } .hide-sm { display:none; } }
</style>
</head>
<body>
<header>
  <h1>apetto 商品後台</h1>
  <span class="muted" id="repo-label" style="color:#9ca3af"></span>
  <span class="sp"></span>
  <a id="site-link" href="./" target="_blank">開啟前台 ↗</a>
  <button class="link" id="btn-settings">設定</button>
</header>
<div id="deploy"></div>

<main>
  <section class="card" id="login" style="display:none">
    <h2>連接 GitHub</h2>
    <p>後台直接把商品資料寫進 GitHub repo，再由 GitHub Actions 重新產生網站。請貼上一組 GitHub token：
      需要這個 repo 的 <b>Contents 讀寫</b> 權限（看部署進度另需 <b>Actions 讀取</b>）。token 只會存在這個瀏覽器的 localStorage。</p>
    <label class="f">Repo（owner/name）</label>
    <input type="text" id="in-repo" placeholder="ama0904/apt">
    <label class="f" style="margin-top:10px">分支</label>
    <input type="text" id="in-branch" placeholder="main">
    <label class="f" style="margin-top:10px">GitHub token</label>
    <input type="password" id="in-token" placeholder="github_pat_… 或 ghp_…" autocomplete="off">
    <div class="dlg-foot" style="padding:14px 0 0; border:none">
      <span class="err" id="login-err"></span>
      <button class="primary" id="btn-login">連接</button>
    </div>
  </section>

  <section id="app" style="display:none">
    <div class="toolbar">
      <button class="primary" id="btn-add">＋ 新增商品</button>
      <button id="btn-reload">重新載入</button>
      <button id="btn-redeploy" title="不改資料，只重新執行部署流程">重新部署</button>
      <span class="count" id="count"></span>
    </div>
    <table>
      <thead>
        <tr><th style="width:64px">圖片</th><th>商品</th><th class="hide-sm">分類</th><th class="hide-sm">首頁區塊</th><th>價格</th><th>狀態</th><th style="width:300px">操作</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <div class="dlg-head"><h2 id="dlg-title">新增商品</h2><button type="button" id="dlg-close" class="small">✕</button></div>
    <div class="dlg-body">
      <div class="grid">
        <div><label class="f">商品名稱 *</label><input type="text" name="name" required></div>
        <div><label class="f">價格（元） *</label><input type="number" name="price" min="0" step="1" required></div>
        <div class="full"><label class="f">所屬分類</label><div class="checks" id="cat-checks"></div></div>
        <div class="full"><label class="f">首頁顯示區塊</label><div class="checks" id="sec-checks"></div></div>
        <div class="full"><label class="f">商品列表簡介（分類頁卡片上的一句話）</label><input type="text" name="summary"></div>
        <div class="full"><label class="f">商品頁重點說明（價格上方，每行一段；也可直接貼 HTML）</label><textarea name="feature"></textarea></div>
        <div class="full"><label class="f">商品介紹（每行一段；也可直接貼 HTML）</label><textarea name="description" class="tall"></textarea></div>
        <div class="full"><label class="f">選項（每行一組，格式：<code>尺寸: S, M, L, XL</code>）</label><textarea name="options" style="min-height:56px"></textarea></div>
        <div>
          <label class="f">主圖 <span id="img-req">*</span></label>
          <input type="file" name="image" accept="image/*">
          <div class="thumbs" id="cur-main"></div>
          <div class="hint">會在瀏覽器自動裁成列表方塊圖與縮圖。</div>
        </div>
        <div>
          <label class="f">更多圖片（可多選）</label>
          <input type="file" name="gallery" accept="image/*" multiple>
          <div class="thumbs" id="cur-gallery"></div>
          <label class="hint" id="clear-gal-wrap" style="display:none"><input type="checkbox" name="clear_gallery" value="1"> 清除現有的更多圖片</label>
          <div class="hint">重新選擇檔案會取代原本的圖片組。</div>
        </div>
        <div class="full"><label class="checks"><input type="checkbox" name="visible" value="1" checked> 上架（顯示在前台）</label></div>
      </div>
    </div>
    <div class="dlg-foot">
      <span class="err" id="form-err"></span>
      <span class="progress" id="form-progress"></span>
      <button type="button" id="dlg-cancel">取消</button>
      <button type="submit" class="primary" id="dlg-save">儲存並發布</button>
    </div>
  </form>
</dialog>
<div id="toast"></div>

<script>
/* ---------------------------------------------------------------- config / auth */
const $ = s => document.querySelector(s);
const LS = { token: 'apetto_admin_token', repo: 'apetto_admin_repo', branch: 'apetto_admin_branch' };
const SITE_DIR = 'www.apetto.com.tw';
const SECTIONS_FALLBACK = [{ key: 'all', name: '全系列' }, { key: 'bestseller', name: '暢銷商品' }, { key: 'latest', name: '推薦商品' }];

function guessRepo() {
  const h = location.hostname, seg = location.pathname.split('/').filter(Boolean);
  if (h.endsWith('.github.io') && seg.length) return `${h.split('.')[0]}/${seg[0]}`;
  return 'ama0904/apt';
}
const cfg = {
  get token() { return localStorage.getItem(LS.token) || ''; },
  get repo() { return localStorage.getItem(LS.repo) || guessRepo(); },
  get branch() { return localStorage.getItem(LS.branch) || 'main'; },
};
const dataPath = () => `${SITE_DIR}/_data/products.json`;
const rawUrl = p => `https://raw.githubusercontent.com/${cfg.repo}/${cfg.branch}/${SITE_DIR}/${p.split('/').map(encodeURIComponent).join('/')}`;
const siteUrl = () => { const [o, r] = cfg.repo.split('/'); return `https://${o}.github.io/${r}/`; };

/* ---------------------------------------------------------------- github api */
async function gh(path, opts = {}) {
  const r = await fetch(`https://api.github.com${path}`, {
    ...opts,
    headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${cfg.token}`, 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}), ...(opts.headers || {}) },
  });
  if (r.status === 204) return {};
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) {
    const msg = j.message || `${r.status} ${r.statusText}`;
    if (r.status === 401) throw new Error('token 無效或已過期（401）');
    if (r.status === 403 || r.status === 404) throw new Error(`${msg}（請確認 token 有這個 repo 的權限）`);
    throw new Error(msg);
  }
  return j;
}
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
const b64decodeUtf8 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0)));
function b64encodeUtf8(str) { const bytes = new TextEncoder().encode(str); let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); }
async function blobToB64(blob) { const buf = new Uint8Array(await blob.arrayBuffer()); let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000)); return btoa(bin); }

async function readProducts() {
  const j = await gh(`/repos/${cfg.repo}/contents/${encPath(dataPath())}?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}`);
  return { data: JSON.parse(b64decodeUtf8(j.content)), sha: j.sha };
}

/** One commit with several file changes via the Git Data API.
 *  files: [{ path, base64 }] to add/replace, [{ path, delete:true }] to remove. */
async function commitFiles(files, message, onProgress) {
  const R = `/repos/${cfg.repo}`;
  const ref = await gh(`${R}/git/ref/heads/${encodeURIComponent(cfg.branch)}`);
  const headSha = ref.object.sha;
  const headCommit = await gh(`${R}/git/commits/${headSha}`);
  const tree = [];
  let i = 0;
  for (const f of files) {
    i++;
    if (f.delete) { tree.push({ path: f.path, mode: '100644', type: 'blob', sha: null }); continue; }
    onProgress && onProgress(`上傳檔案 ${i}/${files.length}…`);
    const blob = await gh(`${R}/git/blobs`, { method: 'POST', body: JSON.stringify({ content: f.base64, encoding: 'base64' }) });
    tree.push({ path: f.path, mode: '100644', type: 'blob', sha: blob.sha });
  }
  onProgress && onProgress('建立 commit…');
  const newTree = await gh(`${R}/git/trees`, { method: 'POST', body: JSON.stringify({ base_tree: headCommit.tree.sha, tree }) });
  const commit = await gh(`${R}/git/commits`, { method: 'POST', body: JSON.stringify({ message, tree: newTree.sha, parents: [headSha] }) });
  try {
    await gh(`${R}/git/refs/heads/${encodeURIComponent(cfg.branch)}`, { method: 'PATCH', body: JSON.stringify({ sha: commit.sha, force: false }) });
  } catch (e) {
    throw new Error('資料已被別人更新，請按「重新載入」後再試一次。（' + e.message + '）');
  }
  return commit.sha;
}

async function listUploads(pid) {
  try {
    const items = await gh(`/repos/${cfg.repo}/contents/${encPath(SITE_DIR + '/_data/uploads')}?ref=${encodeURIComponent(cfg.branch)}`);
    return (Array.isArray(items) ? items : []).filter(it => it.type === 'file' && it.name.startsWith(`p${pid}_`)).map(it => it.path);
  } catch (e) { return []; }
}

/* ---------------------------------------------------------------- deploy status */
let deployTimer = null;
async function watchDeploy(sinceSha) {
  clearTimeout(deployTimer);
  const box = $('#deploy');
  const tick = async () => {
    try {
      const j = await gh(`/repos/${cfg.repo}/actions/runs?branch=${encodeURIComponent(cfg.branch)}&per_page=1&t=${Date.now()}`);
      const run = j.workflow_runs && j.workflow_runs[0];
      if (!run) { box.style.display = 'none'; return; }
      const link = `<a href="${run.html_url}" target="_blank">查看流程</a>`;
      box.style.display = '';
      if (run.status !== 'completed') {
        box.className = ''; box.innerHTML = `⏳ 網站正在重新產生與部署（${run.status === 'queued' ? '排隊中' : '進行中'}）… 通常需要 1 到 2 分鐘。${link}`;
        deployTimer = setTimeout(tick, 8000);
      } else if (run.conclusion === 'success') {
        box.className = 'ok'; box.innerHTML = `✅ 最新版本已部署完成。<a href="${siteUrl()}" target="_blank">開啟前台</a> · ${link}`;
        if (sinceSha && run.head_sha !== sinceSha) deployTimer = setTimeout(tick, 8000);
      } else if (run.conclusion === 'cancelled') {
        box.className = ''; box.innerHTML = `上一輪部署被新的變更取代，等待最新一輪… ${link}`; deployTimer = setTimeout(tick, 8000);
      } else {
        box.className = 'bad'; box.innerHTML = `❌ 部署失敗（${run.conclusion}）。${link}`;
      }
    } catch (e) { box.style.display = 'none'; }
  };
  tick();
}

/* ---------------------------------------------------------------- image processing (browser side) */
function loadImage(file) {
  return new Promise((res, rej) => { const url = URL.createObjectURL(file); const img = new Image(); img.onload = () => { URL.revokeObjectURL(url); res(img); }; img.onerror = () => rej(new Error('無法讀取圖片 ' + file.name)); img.src = url; });
}
function canvasJpeg(img, w, h, mode) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  const iw = img.naturalWidth, ih = img.naturalHeight;
  if (mode === 'cover') {
    const s = Math.max(w / iw, h / ih), dw = iw * s, dh = ih * s;
    ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
  } else ctx.drawImage(img, 0, 0, w, h);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.88));
}
async function processImage(file, pid, slot) {
  const img = await loadImage(file);
  const iw = img.naturalWidth, ih = img.naturalHeight, max = 1200, s = Math.min(1, max / Math.max(iw, ih));
  const base = `_data/uploads/p${pid}_${slot}`;
  const full = await canvasJpeg(img, Math.round(iw * s), Math.round(ih * s), 'contain');
  const thumb = await canvasJpeg(img, 627, 627, 'cover');
  const small = await canvasJpeg(img, 120, 120, 'cover');
  return {
    paths: { full: base + '.jpg', thumb: base + '-627.jpg', small: base + '-120.jpg' },
    files: [
      { path: `${SITE_DIR}/${base}.jpg`, base64: await blobToB64(full) },
      { path: `${SITE_DIR}/${base}-627.jpg`, base64: await blobToB64(thumb) },
      { path: `${SITE_DIR}/${base}-120.jpg`, base64: await blobToB64(small) },
    ],
  };
}

/* ---------------------------------------------------------------- text helpers (mirror site_builder.py) */
const escHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function textToHtml(t) { t = (t || '').trim(); if (!t) return ''; if (t.includes('<') && t.includes('>')) return t; return t.split(/\r?\n/).filter(l => l.trim()).map(l => `<p>${escHtml(l.trim())}</p>`).join('\n'); }
function parseOptions(t) { const out = []; for (const line of (t || '').split(/\r?\n/)) { const m = line.match(/^([^:：]+)[:：](.+)$/); if (!m) continue; const vals = m[2].split(/[,，、]/).map(v => v.trim()).filter(Boolean); if (m[1].trim() && vals.length) out.push({ name: m[1].trim(), values: vals }); } return out; }
const optionsToText = o => (o || []).map(x => `${x.name}: ${x.values.join(', ')}`).join('\n');
const money = n => '$' + Number(n || 0).toLocaleString('en-US');

/* ---------------------------------------------------------------- state + render */
let S = { data: null, sha: null };
let editing = null;
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }
const catName = id => (S.data.categories.find(c => c.id === id) || { name: id }).name;
const sections = () => S.data.sections || SECTIONS_FALLBACK;
const secName = k => (sections().find(s => s.key === k) || { name: k }).name;

function render() {
  const P = S.data.products, rows = $('#rows'); rows.innerHTML = '';
  $('#count').textContent = `共 ${P.length} 件商品，上架中 ${P.filter(p => p.visible !== false).length} 件`;
  P.forEach((p, i) => {
    const tr = document.createElement('tr');
    if (p.visible === false) tr.className = 'hidden-row';
    const url = `${siteUrl()}product/product&product_id=${p.id}.html`;
    tr.innerHTML = `
      <td><img src="${rawUrl(p.image.thumb || p.image.full)}" alt="" loading="lazy"></td>
      <td class="name"><a href="${url}" target="_blank" title="在前台開啟">${escHtml(p.name)}</a><div class="muted">#${p.id}${p.source === 'original' ? ' · 原站商品' : ' · 後台新增'}</div></td>
      <td class="hide-sm">${(p.categories || []).map(c => `<span class="tag">${escHtml(catName(c))}</span>`).join('') || '<span class="muted">—</span>'}</td>
      <td class="hide-sm">${(p.sections || []).map(s => `<span class="tag sec">${escHtml(secName(s))}</span>`).join('') || '<span class="muted">—</span>'}</td>
      <td>${money(p.price)}</td>
      <td>${p.visible === false ? '<span class="badge off">已下架</span>' : '<span class="badge on">上架中</span>'}</td>
      <td><div class="actions">
        <button class="small" data-act="edit">編輯</button>
        <button class="small" data-act="toggle">${p.visible === false ? '上架' : '下架'}</button>
        <button class="small" data-act="up" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button class="small" data-act="down" ${i === P.length - 1 ? 'disabled' : ''}>↓</button>
        <button class="small danger" data-act="del">刪除</button>
      </div></td>`;
    tr.querySelectorAll('button[data-act]').forEach(b => b.onclick = () => action(b.dataset.act, p));
    rows.appendChild(tr);
  });
}

async function load() {
  S = await readProducts();
  $('#repo-label').textContent = `${cfg.repo} @ ${cfg.branch}`;
  $('#site-link').href = siteUrl();
  render();
  watchDeploy();
}

async function saveData(message, extraFiles = [], onProgress) {
  const json = JSON.stringify(S.data, null, 1);
  const sha = await commitFiles([...extraFiles, { path: dataPath(), base64: b64encodeUtf8(json) }], message, onProgress);
  await load();
  watchDeploy(sha);
}

function busy(on) { document.querySelectorAll('#app button').forEach(b => b.disabled = on); if (!on) render(); }

async function action(act, p) {
  if (act === 'edit') return openForm(p);
  try {
    busy(true);
    const P = S.data.products, i = P.findIndex(x => x.id === p.id);
    if (act === 'toggle') { P[i].visible = p.visible === false; await saveData(`${P[i].visible ? '上架' : '下架'}商品 #${p.id} ${p.name}`); toast(P[i].visible ? '已上架，網站重新部署中' : '已下架，網站重新部署中'); }
    if (act === 'up' || act === 'down') { const j = act === 'up' ? i - 1 : i + 1; if (j < 0 || j >= P.length) return; [P[i], P[j]] = [P[j], P[i]]; await saveData(`調整商品排序 #${p.id}`); }
    if (act === 'del') {
      if (!confirm(`確定要刪除「${p.name}」嗎？\n此動作會移除商品資料與商品頁，無法復原。\n（若只是暫時不賣，請改用「下架」）`)) return;
      const dels = p.source === 'admin' ? (await listUploads(p.id)).map(path => ({ path, delete: true })) : [];
      S.data.products = P.filter(x => x.id !== p.id);
      await saveData(`刪除商品 #${p.id} ${p.name}`, dels); toast('已刪除，網站重新部署中');
    }
  } catch (e) { alert('操作失敗：' + e.message); await load().catch(() => {}); }
  finally { busy(false); }
}

/* ---------------------------------------------------------------- form */
function buildChecks() {
  $('#cat-checks').innerHTML = S.data.categories.map(c => `<label><input type="checkbox" name="categories" value="${c.id}"> ${escHtml(c.name)}</label>`).join('');
  $('#sec-checks').innerHTML = sections().map(s => `<label><input type="checkbox" name="sections" value="${s.key}"> ${escHtml(s.name)}</label>`).join('');
}
function openForm(p) {
  editing = p || null;
  const f = $('#form'); f.reset(); $('#form-err').textContent = ''; $('#form-progress').textContent = '';
  buildChecks();
  $('#dlg-title').textContent = p ? `編輯商品 #${p.id}` : '新增商品';
  $('#img-req').style.display = p ? 'none' : '';
  $('#clear-gal-wrap').style.display = p && p.gallery && p.gallery.length ? '' : 'none';
  $('#cur-main').innerHTML = p && p.image.thumb ? `<img src="${rawUrl(p.image.thumb)}">` : '';
  $('#cur-gallery').innerHTML = p ? (p.gallery || []).map(g => `<img src="${rawUrl(g.small || g.full)}">`).join('') : '';
  if (p) {
    f.name.value = p.name; f.price.value = p.price; f.summary.value = p.summary || '';
    f.feature.value = p.feature_html || ''; f.description.value = p.description_html || ''; f.options.value = optionsToText(p.options);
    f.visible.checked = p.visible !== false;
    f.querySelectorAll('input[name=categories]').forEach(c => c.checked = (p.categories || []).includes(Number(c.value)));
    f.querySelectorAll('input[name=sections]').forEach(c => c.checked = (p.sections || []).includes(c.value));
  } else {
    f.querySelectorAll('input[name=sections]').forEach(c => c.checked = c.value === 'all');
  }
  $('#dlg').showModal();
}

$('#form').onsubmit = async (ev) => {
  ev.preventDefault();
  const f = $('#form'), fd = new FormData(f), prog = m => $('#form-progress').textContent = m;
  const btn = $('#dlg-save'); btn.disabled = true; $('#form-err').textContent = '';
  try {
    const name = (fd.get('name') || '').trim(); if (!name) throw new Error('商品名稱不能空白');
    const price = parseInt(String(fd.get('price')).replace(/,/g, ''), 10); if (!(price >= 0)) throw new Error('價格必須是 0 以上的整數');
    const P = S.data.products;
    const p = editing ? P.find(x => x.id === editing.id) : { id: Math.max(16, ...P.map(x => x.id)) + 1, source: 'admin', gallery: [], image: { full: '', thumb: '', small: '' } };
    Object.assign(p, {
      name, price,
      summary: (fd.get('summary') || '').trim(),
      feature_html: textToHtml(fd.get('feature')),
      description_html: textToHtml(fd.get('description')),
      options: parseOptions(fd.get('options')),
      categories: fd.getAll('categories').map(Number),
      sections: fd.getAll('sections'),
      visible: !!fd.get('visible'),
    });
    const files = [];
    const main = f.image.files[0];
    if (!editing && !main) throw new Error('請上傳主圖');
    if (main) { prog('處理主圖…'); const r = await processImage(main, p.id, 'main'); p.image = r.paths; files.push(...r.files); }
    const gal = Array.from(f.gallery.files);
    if (gal.length) {
      p.gallery = [];
      for (let i = 0; i < gal.length; i++) { prog(`處理圖片 ${i + 1}/${gal.length}…`); const r = await processImage(gal[i], p.id, `g${i + 1}`); p.gallery.push({ full: r.paths.full, small: r.paths.small }); files.push(...r.files); }
    } else if (editing && fd.get('clear_gallery')) p.gallery = [];
    if (!editing) P.push(p);
    await saveData(`${editing ? '更新' : '新增'}商品 #${p.id} ${name}`, files, prog);
    $('#dlg').close(); toast(editing ? '已更新，網站重新部署中' : '已新增，網站重新部署中');
  } catch (e) { $('#form-err').textContent = e.message; await load().catch(() => {}); }
  finally { btn.disabled = false; prog(''); }
};

/* ---------------------------------------------------------------- wiring */
function showLogin(err) {
  $('#login').style.display = ''; $('#app').style.display = 'none';
  $('#in-repo').value = cfg.repo; $('#in-branch').value = cfg.branch; $('#in-token').value = cfg.token;
  $('#login-err').textContent = err || '';
}
async function connect() {
  const repo = $('#in-repo').value.trim() || guessRepo(), branch = $('#in-branch').value.trim() || 'main', token = $('#in-token').value.trim();
  if (!token) return $('#login-err').textContent = '請輸入 token';
  localStorage.setItem(LS.repo, repo); localStorage.setItem(LS.branch, branch); localStorage.setItem(LS.token, token);
  $('#login-err').textContent = '連接中…';
  try { await load(); $('#login').style.display = 'none'; $('#app').style.display = ''; }
  catch (e) { $('#login-err').textContent = '連接失敗：' + e.message; }
}
$('#btn-login').onclick = connect;
$('#in-token').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
$('#btn-settings').onclick = () => showLogin('');
$('#btn-add').onclick = () => openForm(null);
$('#btn-reload').onclick = () => load().then(() => toast('已重新載入')).catch(e => alert(e.message));
$('#btn-redeploy').onclick = async () => { try { await gh(`/repos/${cfg.repo}/actions/workflows/deploy.yml/dispatches`, { method: 'POST', body: JSON.stringify({ ref: cfg.branch }) }); toast('已觸發重新部署'); setTimeout(() => watchDeploy(), 3000); } catch (e) { alert(e.message); } };
$('#dlg-close').onclick = $('#dlg-cancel').onclick = () => $('#dlg').close();

(async () => {
  if (!cfg.token) return showLogin('');
  try { await load(); $('#app').style.display = ''; }
  catch (e) { showLogin('連接失敗：' + e.message); }
})();
</script>
